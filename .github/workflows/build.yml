name: Build Strit Visual

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Check project files
        run: |
          echo "Project root:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 3 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - name: Find generated JAR
        if: always()
        run: |
          echo "Searching for JAR files:"
          find . -type f -name "*.jar" -not -path "./.gradle/*" -print || true
          echo "Build directories:"
          find . -type d -name build -print || true
          echo "Gradle tasks:"
          gradle tasks --all --no-daemon || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StritVisual
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
          
