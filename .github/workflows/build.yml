name: Build Strit Visual

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Grant execute permission
    run: chmod +x gradlew

  - name: Build Strit Visual
    run: ./gradlew build --no-daemon

  - name: Find JAR files
    run: |
      echo "Searching for built JAR files..."
      find . -type f -path "*/build/libs/*.jar" \
        ! -name "*-sources.jar" \
        ! -name "*-javadoc.jar"

      if ! find . -type f -path "*/build/libs/*.jar" \
        ! -name "*-sources.jar" \
        ! -name "*-javadoc.jar" | grep -q .; then
        echo "ERROR: No mod JAR was created."
        exit 1
      fi

  - name: Upload Strit Visual
    uses: actions/upload-artifact@v4
    with:
      name: StritVisual
      path: '**/build/libs/*.jar'
      if-no-files-found: error
